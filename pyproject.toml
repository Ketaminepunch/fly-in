[project]
name = "fly-in"
version = "0.1.0"
description = "Efficient drone fleet routing simulator across a network of zones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "hypothesis>=6.165.0",
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tester.py"]

[tool.flake8]
max-line-length = 100

[tool.ruff]
line-length = 79
